# Checks that run somewhere other than the maintainer's machine.
#
# The gate has always run on the one computer it is capable of freezing, which is
# why it does not get run between commits — and two regressions were found late
# because of that. `source control` was red on master for six commits, and
# `multi-language lsp` passed for its whole existence while running from a path
# shape that could not expose the bug it was written to catch. Neither was hard to
# see. Nobody was looking.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: 'Suites to run on Windows, comma-separated. Blank runs the whole gate.'
        required: false
        default: ''
  # Everything, once a day, while nobody is waiting for it.
  schedule:
    - cron: '0 9 * * *'

# A second push supersedes the first: nothing here is worth finishing for a commit
# that has already been replaced. Nothing else supersedes anything. The nightly is
# not racing a newer copy of itself, and cancelling it would mean the one full run
# of the day is the one that got interrupted — and a dispatch is somebody asking a
# question on purpose, so asking a second one should not throw away the answer to
# the first. That is not hypothetical: it is how these are run one suite at a time.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  fast:
    name: typecheck, units, contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # None of this runs the app, and the download is 200MB of nothing useful.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # EMBER_STRICT is deliberately not set here. Several unit tables skip the
      # shells they cannot find, and on Linux that is all of them; strict would
      # turn "no PowerShell on this runner" into a failure that means nothing.
      - run: npm run test:units
      - name: Theme contrast
        run: node scripts/verify-contrast.mjs
      # The plan and the directory have to agree, which is what stops a suite
      # existing on disk that nothing ever runs.
      - name: Every suite is in the gate's plan
        run: node scripts/gate.mjs --list

  smoke:
    name: windows smoke
    runs-on: windows-latest
    needs: fast
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/electron-binary
      - run: npx electron-vite build
      # The runner is an administrator with UAC off, so everything below would be an
      # elevated Ember: its user data one directory down, and no Claude Code bridge,
      # which is correct for an elevated window and wrong for what is being tested.
      # unelevated.ps1 starts each command with the token an ordinary user has, and
      # this step fails if that stops being true, rather than letting the suites
      # quietly go back to testing the administrator's window.
      - name: The suites run as an ordinary user
        shell: pwsh
        run: pwsh -NoProfile -File .github/unelevated.ps1 'node .github/elevation.mjs --expect unelevated'
        env:
          EMBER_KEEP_LOGS: ${{ runner.temp }}/ember-logs
      # The broad one first: a real shell through a real pty, and a real editor.
      # Skipped when particular suites were asked for, since it is most of the
      # wall clock and none of the answer.
      - name: verify.mjs
        if: ${{ !inputs.only }}
        shell: pwsh
        run: pwsh -NoProfile -File .github/unelevated.ps1 'node scripts/verify.mjs'
        env:
          EMBER_KEEP_LOGS: ${{ runner.temp }}/ember-logs
      # The suites that are green on a runner, which is not yet all of them.
      #
      # Ten were tried and seven pass here now. Neither of the two that came back
      # was failing on its subject. lsp read "no server available for powershell"
      # as a server that had started and then answered nothing, when it is the app
      # saying this machine has no copy. boom read the session file out of the
      # profile it named on the command line, and an already-elevated process —
      # which is everything on a hosted runner — keeps its user data one directory
      # further down, so it reported lost work on a machine that had lost none.
      #
      # Three still fail here while passing on the maintainer's machine, and each
      # is listed with what it actually said rather than quietly dropped — a
      # subset that hides its exclusions is the same trick as a check that cannot
      # fail:
      #
      #   verify-git      "explorer marks the untracked file — []"
      #   verify-blocks   no detail surfaced yet
      #   verify-session  "the restored view is weighted to the bottom — 114px
      #                   above the end", which is what was left once it stopped
      #                   reading the wrong directory. The window is resized 140px
      #                   smaller and the view is read 800ms later, and 114 is most
      #                   of 140 — so this may well be one more check about the
      #                   clock.
      #
      # They still run in the nightly, where red is the honest state until they
      # are fixed. Keeping them out of the per-push job is so that a red smoke
      # means something new broke, rather than meaning what it meant yesterday.
      #
      # Which is also how the four get diagnosed: `gh workflow run ci.yml -f
      # only=boom` runs one of them here, on demand, without putting it back in
      # the set that guards every push. The list goes through the environment
      # rather than into the command line, because a dispatch input is a string
      # somebody typed.
      - name: Suites
        shell: pwsh
        run: pwsh -NoProfile -File .github/unelevated.ps1 'pwsh -NoProfile -Command node scripts/gate.mjs --only $env:SUITES; exit $LASTEXITCODE'
        env:
          SUITES: ${{ inputs.only || 'settings,output,shell,history,flood,lsp,boom' }}
          EMBER_STRICT: '1'
          # A hosted runner, so what only a real machine has is excused by name. The
          # full job says the same with gate --hosted, which sets it for each suite.
          EMBER_HOSTED: '1'
          EMBER_KEEP_LOGS: ${{ runner.temp }}/ember-logs
      # The screenshots and the main-process logs are the only way to read a
      # failure that happened on a machine nobody can look at. This collected
      # neither for its first three runs — profiles are made in os.tmpdir() rather
      # than here, and deleted before the upload could reach them, so the glob
      # matched nothing and `if-no-files-found: ignore` kept quiet about it.
      #
      # "No artifacts will be uploaded" is still the ordinary outcome and does not
      # mean that is happening again: main writes ember.log when it has a fault to
      # report, so a suite that failed an assertion rather than breaking main
      # leaves none, and only some suites take screenshots. What it is here for is
      # the other kind — a crash, a stack trace, a window that never appeared —
      # where the suite's own output in this log does not say enough.
      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            .shots/
            ${{ runner.temp }}/ember-logs/
          if-no-files-found: ignore
          # `.shots` starts with a dot, and upload-artifact has skipped hidden
          # files by default since v4.4 — so the screenshots this step names were
          # never in the artifact, and only the logs ever arrived.
          include-hidden-files: true
          retention-days: 7

  full:
    name: every suite
    runs-on: windows-latest
    needs: fast
    # Nightly, and on demand when something wants proving before a tag — but not
    # when the dispatch asked for particular suites, which smoke has just run.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.only)
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/electron-binary
      - run: npx electron-vite build
      # The runner is an administrator with UAC off, so everything below would be an
      # elevated Ember: its user data one directory down, and no Claude Code bridge,
      # which is correct for an elevated window and wrong for what is being tested.
      # unelevated.ps1 starts each command with the token an ordinary user has, and
      # this step fails if that stops being true, rather than letting the suites
      # quietly go back to testing the administrator's window.
      - name: The suites run as an ordinary user
        shell: pwsh
        run: pwsh -NoProfile -File .github/unelevated.ps1 'node .github/elevation.mjs --expect unelevated'
        env:
          EMBER_KEEP_LOGS: ${{ runner.temp }}/ember-logs
      # Strict, so a suite that skips itself for want of a shell or a login counts
      # as a failure rather than as silence. That is the whole difference between
      # a gate and a habit.
      # --hosted leaves out the three suites that need something no hosted runner
      # has (VS Code, a gh login, Claude Code), and prints them with the reason. The
      # list lives in gate.mjs, beside the suites it names.
      - name: The gate
        shell: pwsh
        run: pwsh -NoProfile -File .github/unelevated.ps1 'node scripts/gate.mjs --hosted'
        env:
          EMBER_STRICT: '1'
          EMBER_KEEP_LOGS: ${{ runner.temp }}/ember-logs
      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-evidence
          path: |
            .shots/
            ${{ runner.temp }}/ember-logs/
          if-no-files-found: ignore
          # `.shots` starts with a dot, and upload-artifact has skipped hidden
          # files by default since v4.4 — so the screenshots this step names were
          # never in the artifact, and only the logs ever arrived.
          include-hidden-files: true
          retention-days: 14
