# Checks that run somewhere other than the maintainer's machine.
#
# The gate has always run on the one computer it is capable of freezing, which is
# why it does not get run between commits — and two regressions were found late
# because of that. `source control` was red on master for six commits, and
# `multi-language lsp` passed for its whole existence while running from a path
# shape that could not expose the bug it was written to catch. Neither was hard to
# see. Nobody was looking.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Everything, once a day, while nobody is waiting for it.
  schedule:
    - cron: '0 9 * * *'

# A second push supersedes the first: nothing here is worth finishing for a commit
# that has already been replaced. The nightly is left alone — it is not racing
# anything, and cancelling it would mean the one full run of the day is the one
# that got interrupted.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  fast:
    name: typecheck, units, contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # None of this runs the app, and the download is 200MB of nothing useful.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # EMBER_STRICT is deliberately not set here. Several unit tables skip the
      # shells they cannot find, and on Linux that is all of them; strict would
      # turn "no PowerShell on this runner" into a failure that means nothing.
      - run: npm run test:units
      - name: Theme contrast
        run: node scripts/verify-contrast.mjs
      # The plan and the directory have to agree, which is what stops a suite
      # existing on disk that nothing ever runs.
      - name: Every suite is in the gate's plan
        run: node scripts/gate.mjs --list

  smoke:
    name: windows smoke
    runs-on: windows-latest
    needs: fast
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/electron-binary
      - run: npx electron-vite build
      # The suites that would have caught what got past us, and little else: the
      # pty and its blocks, a session across a restart, a shell that dies, the
      # settings dialog, the flow valve under a flood, and the crash screen. Run
      # through the gate rather than one by one so the runner's own accounting —
      # the fault audit in each profile's log — applies here too.
      #
      # Under three quarters of an hour, which is the point of a subset. The whole
      # gate runs nightly.
      - name: Suites
        run: node scripts/gate.mjs --only blocks,output,session,shell,settings,flood,boom,git,history,lsp
        env:
          EMBER_STRICT: '1'
      # The screenshots and the main-process logs are the only way to read a
      # failure that happened on a machine nobody can look at.
      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            .shots/
            ${{ runner.temp }}/ember-profile-*/ember.log
          if-no-files-found: ignore
          retention-days: 7

  full:
    name: every suite
    runs-on: windows-latest
    needs: fast
    # Nightly, and on demand when something wants proving before a tag.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/electron-binary
      - run: npx electron-vite build
      # Strict, so a suite that skips itself for want of a shell or a login counts
      # as a failure rather than as silence. That is the whole difference between
      # a gate and a habit.
      - name: The gate
        run: node scripts/gate.mjs
        env:
          EMBER_STRICT: '1'
      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-evidence
          path: |
            .shots/
            ${{ runner.temp }}/ember-profile-*/ember.log
          if-no-files-found: ignore
          retention-days: 14
