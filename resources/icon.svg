<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Ember's mark: the prompt, lit.

    A deep-tide tile — the same ground and card border the app itself draws — with
    the one symbol that means "terminal" at any size, and the ember living where
    embers live in a terminal: in the cursor. The chevron invites; the coal-warm
    block beside it is the app's one point of heat on a cold palette, which is
    what makes it findable in a taskbar full of dark tiles. At 16px the shape
    survives as a dark square, a light angle and a warm dot, in that order.
  -->
  <defs>
    <linearGradient id="tide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123641" />
      <stop offset="46%" stop-color="#0a212b" />
      <stop offset="100%" stop-color="#04141d" />
    </linearGradient>

    <radialGradient id="coal" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ffe3b0" />
      <stop offset="35%" stop-color="#ffa05e" />
      <stop offset="75%" stop-color="#e2532a" />
      <stop offset="100%" stop-color="#a53215" />
    </radialGradient>

    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2532a" />
      <stop offset="55%" stop-color="#ff8a3d" />
      <stop offset="100%" stop-color="#ffb066" />
    </linearGradient>

    <radialGradient id="heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#ff6a1f" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ff6a1f" stop-opacity="0" />
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- The tile: the app's own ground, wearing the app's own card border. -->
  <g filter="url(#drop)">
    <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#tide)" />
    <rect
      x="37.5" y="37.5" width="437" height="437" rx="94.5"
      fill="none" stroke="#1f4e5c" stroke-width="3"
    />
    <!-- A whisper of the accent along the lit top edge, like the cards catch. -->
    <rect
      x="42" y="42" width="428" height="428" rx="90"
      fill="none" stroke="#6fd0e0" stroke-opacity="0.10" stroke-width="2.5"
    />
  </g>

  <!-- The chevron, with its own light bleeding a little into the tile. -->
  <path
    d="M164 172 L288 256 L164 340"
    fill="none" stroke="#6fd0e0" stroke-opacity="0.4" stroke-width="72"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"
  />
  <path
    d="M164 172 L288 256 L164 340"
    fill="none" stroke="#6fd0e0" stroke-width="44"
    stroke-linecap="round" stroke-linejoin="round"
  />

  <!--
    The ember: a block cursor at rest on the same line — lit. The flame rising off
    it is what says "ember" rather than "orange rectangle", and the two sparks
    drifting up say it recently moved. At small sizes the flame folds into the
    coal's glow and the mark degrades to a warm dot, which is enough.
  -->
  <circle cx="356" cy="304" r="112" fill="url(#heat)" />
  <path
    d="M356 208 C338 240 322 258 322 288 A34 34 0 0 0 390 288 C390 258 374 240 356 208 Z"
    fill="url(#flame)"
  />
  <path
    d="M356 254 C347 270 340 279 340 293 A16 16 0 0 0 372 293 C372 279 365 270 356 254 Z"
    fill="#ffe3b0" fill-opacity="0.92"
  />
  <rect x="312" y="296" width="88" height="48" rx="13" fill="url(#coal)" />
  <rect
    x="312" y="296" width="88" height="48" rx="13"
    fill="none" stroke="#ffd9a0" stroke-opacity="0.55" stroke-width="2.5"
  />
  <circle cx="404" cy="196" r="7" fill="#ffb066" fill-opacity="0.9" />
  <circle cx="322" cy="176" r="4.5" fill="#ff8a3d" fill-opacity="0.7" />
</svg>
