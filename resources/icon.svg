<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Ember's mark: the prompt is the coal, and the cursor is a campfire.

    The chevron burns — drawn in the ember gradient rather than the accent, so the
    warmth is the identity and not an accessory. Where a cursor would sit, three
    logs lean into each other over a bed of coals, lit from below the way the
    photograph that briefed this is lit, with sparks drifting off the top. At
    16px the fire folds into a warm wedge beside a burning chevron, which still
    reads: something is alight in this terminal.
  -->
  <defs>
    <linearGradient id="tide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123641" />
      <stop offset="46%" stop-color="#0a212b" />
      <stop offset="100%" stop-color="#04141d" />
    </linearGradient>

    <linearGradient id="emberup" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffd9a0" />
      <stop offset="50%" stop-color="#ff8a3d" />
      <stop offset="100%" stop-color="#e2532a" />
    </linearGradient>

    <!-- A log: lit most of the way up, only the very top still char — the wood
         in the briefing photograph glows along its length, not just at the foot. -->
    <linearGradient id="wood" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffcf8a" />
      <stop offset="30%" stop-color="#ff8a3d" />
      <stop offset="62%" stop-color="#c2571f" />
      <stop offset="88%" stop-color="#6b2f16" />
      <stop offset="100%" stop-color="#3a180c" />
    </linearGradient>

    <radialGradient id="heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#ff6a1f" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ff6a1f" stop-opacity="0" />
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- The tile: the app's own ground, wearing the app's own card border. -->
  <g filter="url(#drop)">
    <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#tide)" />
    <rect
      x="37.5" y="37.5" width="437" height="437" rx="94.5"
      fill="none" stroke="#1f4e5c" stroke-width="3"
    />
    <rect
      x="42" y="42" width="428" height="428" rx="90"
      fill="none" stroke="#6fd0e0" stroke-opacity="0.10" stroke-width="2.5"
    />
  </g>

  <!-- The burning prompt. -->
  <circle cx="212" cy="256" r="140" fill="url(#heat)" />
  <path
    d="M150 168 L272 256 L150 344"
    fill="none" stroke="url(#emberup)" stroke-width="50"
    stroke-linecap="round" stroke-linejoin="round"
  />
  <path
    d="M150 168 L272 256 L150 344"
    fill="none" stroke="#ffe3b0" stroke-opacity="0.35" stroke-width="18"
    stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- The campfire, where the cursor would rest. -->
  <circle cx="354" cy="312" r="118" fill="url(#heat)" />

  <!-- The log behind, nearly upright, mostly char. -->
  <rect
    x="342" y="230" width="20" height="116" rx="9"
    fill="url(#wood)" opacity="0.85" transform="rotate(4 352 288)"
  />
  <!-- Fire showing between the front pair. -->
  <ellipse cx="352" cy="316" rx="20" ry="34" fill="#ffe3b0" fill-opacity="0.9" filter="url(#soft)" />
  <!-- The leaning pair, tops meeting, feet in the coals. -->
  <rect
    x="319" y="240" width="23" height="112" rx="10"
    fill="url(#wood)" transform="rotate(19 330 296)"
  />
  <rect
    x="362" y="240" width="23" height="112" rx="10"
    fill="url(#wood)" transform="rotate(-19 374 296)"
  />
  <!-- Lit inner edges, where the fire touches the wood. -->
  <path
    d="M340 332 L327 258 M364 332 L377 258"
    stroke="#ffd9a0" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"
  />

  <!-- The bed of coals. -->
  <ellipse cx="352" cy="348" rx="56" ry="13" fill="#e2532a" fill-opacity="0.9" />
  <ellipse cx="352" cy="346" rx="34" ry="8" fill="#ffb066" />
  <ellipse cx="350" cy="345" rx="16" ry="5" fill="#ffe3b0" />

  <!-- Embers, adrift. -->
  <circle cx="384" cy="206" r="6.5" fill="#ffb066" fill-opacity="0.95" />
  <circle cx="356" cy="172" r="4" fill="#ff8a3d" fill-opacity="0.75" />
  <circle cx="410" cy="246" r="5" fill="#ff8a3d" fill-opacity="0.8" />
  <circle cx="330" cy="196" r="3" fill="#ffb066" fill-opacity="0.6" />
  <circle cx="398" cy="160" r="2.8" fill="#ff8a3d" fill-opacity="0.5" />
</svg>
